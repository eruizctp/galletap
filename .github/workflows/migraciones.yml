name: Migraciones
# Aplica supabase/migrations al proyecto Supabase al unir a main.
# Así una migración nunca queda olvidada (en Cierra es el paso que más se olvida).
# Secretos del repo (Settings → Secrets and variables → Actions):
#   SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD y SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
# Al lanzar al público se suma un ambiente staging con su propio proyecto.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan secretos de Supabase en los secretos del repo"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --include-all
